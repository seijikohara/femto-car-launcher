<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #eaeaea;
      }
      /* height:100% resolves to 0 inside an Android WebView (the container
         measures 0 px tall); fixed/inset fills the WebView viewport reliably. */
      #map {
        position: fixed;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script type="module" src="/src/googlemaps-main.ts"></script>
  </body>
</html>
