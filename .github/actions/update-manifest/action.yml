name: Update manifest
description: >-
  Build the femto-car-launcher-update.json manifest published beside every
  release APK, so the in-app updater can discover the latest version and
  verify a download without scraping the GitHub release page. A missing
  manifest must read as "no update information", never an error, so its
  shape has to be exact — the asset name and schemaVersion are defined only
  here, the one place both the nightly and the stable release job call.

inputs:
  channel:
    description: 'stable or nightly'
    required: true
  version-code:
    description: 'versionCode, e.g. 26092401'
    required: true
  version-name:
    description: 'versionName, e.g. 2026.09.24-1'
    required: true
  apk-path:
    description: 'Path to the APK as uploaded, staged under its published asset name (e.g. femto-car-launcher-v2026.09.24-1.apk): its size, sha256 and file name go into the manifest'
    required: true
  release-tag:
    description: 'Tag of the release the APK is published under (e.g. v2026.09.24-1, or nightly), for its download URL'
    required: true

outputs:
  path:
    description: 'Path to the written manifest JSON'
    value: ${{ steps.write.outputs.path }}

runs:
  using: composite
  steps:
    - name: Write update manifest
      id: write
      # Composite steps do not infer a shell; bash is explicit here.
      shell: bash
      env:
        CHANNEL: ${{ inputs.channel }}
        VERSION_CODE: ${{ inputs.version-code }}
        VERSION_NAME: ${{ inputs.version-name }}
        APK_PATH: ${{ inputs.apk-path }}
        RELEASE_TAG: ${{ inputs.release-tag }}
      run: |
        set -euo pipefail
        # The APK is staged under the asset name it is uploaded with, and GitHub
        # serves every release asset under one URL shape, so both come from
        # here rather than from inputs that could drift from the uploaded file.
        name="$(basename "$APK_PATH")"
        url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$name"
        size="$(stat -c %s "$APK_PATH")"
        sha256="$(sha256sum "$APK_PATH" | awk '{print $1}')"
        manifest="$RUNNER_TEMP/femto-car-launcher-update.json"
        # jq -n assembles the object field by field so every value is escaped
        # by jq itself; string concatenation could not guarantee valid JSON
        # even for values that look safe, like a versionName.
        jq -n \
          --arg channel "$CHANNEL" \
          --argjson versionCode "$VERSION_CODE" \
          --arg versionName "$VERSION_NAME" \
          --arg name "$name" \
          --argjson size "$size" \
          --arg sha256 "$sha256" \
          --arg url "$url" \
          '{
            schemaVersion: 1,
            channel: $channel,
            versionCode: $versionCode,
            versionName: $versionName,
            apk: {
              name: $name,
              size: $size,
              sha256: $sha256,
              url: $url
            }
          }' > "$manifest"
        echo "path=$manifest" >> "$GITHUB_OUTPUT"
        echo "wrote $manifest for channel=$CHANNEL versionName=$VERSION_NAME"
