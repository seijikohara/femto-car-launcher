name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

# Cancel superseded PR runs; never cancel an in-flight main/develop publish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      # Run the check groups as parallel jobs so wall-clock is the slowest group
      # (assemble), not their sum. The Gradle build cache (org.gradle.caching) lets
      # each job reuse the compile/dex outputs the latest main run populated, so the
      # parallel split does not triple the heavy work on warm caches. fail-fast off
      # so one failing group still reports the others.
      fail-fast: false
      matrix:
        include:
          - name: static-checks
            # lint covers the default variant (stableDebug) only. lintNightlyRelease is
            # added because it is the one PR check that compiles app/src/nightly/res —
            # nothing else does (AGP creates unit-test components for the testBuildType
            # alone, so `test` never touches the nightly source set either) — and the
            # nightly channel is the tester feed, so a malformed override there must
            # fail here, not the publish job.
            tasks: spotlessCheck lint lintNightlyRelease
          - name: unit-tests
            # verifyRoborazziStableDebug runs the unit tests in screenshot-verify mode,
            # so folding it in with `test` executes testStableDebugUnitTest once (two
            # separate invocations ran it twice). CI-only: the Roborazzi goldens are
            # recorded on this runner OS (record-screenshots.yml), so the screenshot
            # diff runs here, not in the local verify-android-build skill — a
            # developer's render would mismatch the Linux-recorded goldens on font
            # antialiasing.
            #
            # `test` itself runs only testStableDebugUnitTest: AGP creates unit-test
            # components for the testBuildType (stableDebug) alone, so stableRelease and
            # nightlyRelease have no unit-test task to run at all. The nightly source
            # set still gets a PR check — see lintNightlyRelease on static-checks above.
            #
            # generateCatalog with a one-entry filter proves the screenshot-catalog
            # generator still boots Robolectric, without paying for the full 960-image
            # render on every PR.
            tasks: test verifyRoborazziStableDebug generateCatalog -Pfemto.catalog.filter=head-unit-853x512__medium__light__right__bottom
          - name: assemble
            tasks: assembleStableDebug
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          # setup-gradle writes the cache only on main/develop; a run can only restore a
          # cache written on its own branch or its base. PRs now mostly target develop,
          # so develop needs write access too, or its PRs would never see a warm cache.
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      # The three groups together mirror the local verify-android-build skill
      # (spotlessCheck + test + lint + assembleStableDebug); change both together.
      - name: Run ${{ matrix.name }}
        env:
          GRADLE_TASKS: ${{ matrix.tasks }}
        run: ./gradlew $GRADLE_TASKS --stacktrace

      - name: Check the catalog smoke render
        if: matrix.name == 'unit-tests'
        run: |
          manifest=app/build/outputs/catalog/manifest.json
          jq -e --arg sha "$GITHUB_SHA" \
            '.schemaVersion == 1 and .gitSha == $sha and (.entries | length) == 1' "$manifest"
          test -s "app/build/outputs/catalog/$(jq -r '.entries[0].file' "$manifest")"
          test "$(ls app/build/outputs/catalog/img | wc -l)" -eq 1

  # The project website (docs/) is not part of the Gradle build, so it gets its
  # own leg: type-check, format, lint, unit tests, and a full static build
  # (without the screenshot catalog, which only the docs.yml deploy generates).
  docs:
    name: docs-site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: docs/package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: docs/.node-version
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm run check

      - name: Build
        run: pnpm run build

  # Single status check the branch ruleset requires by the name "Validate". It
  # stays stable regardless of how the matrix legs above are split or renamed, and
  # fails if any leg — the Gradle matrix or the docs-site job — failed.
  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs: [checks, docs]
    if: always()
    steps:
      - name: Confirm all check groups passed
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
        run: |
          if [ "$CHECKS_RESULT" != "success" ] || [ "$DOCS_RESULT" != "success" ]; then
            echo "::error::A Validate check group failed (checks: $CHECKS_RESULT, docs: $DOCS_RESULT)."
            exit 1
          fi

  nightly:
    name: Publish nightly
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    # Serialize publishes so two concurrent develop pushes never race on the rolling
    # "nightly" tag (delete-then-create); queue them rather than cancel an
    # in-flight publish midway.
    concurrency:
      group: nightly-release
      cancel-in-progress: false
    permissions:
      # gh release create/delete + tag manipulation require write access to repo
      # contents. The default GITHUB_TOKEN satisfies this for the same repo.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: the rolling "nightly" tag needs to be deleted and re-pointed,
          # and app-version counts today's commits since midnight for its day counter.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      - name: Verify signing secrets are present
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          # Fail fast (and clearly) if any signing secret is missing, so the job
          # never reaches Gradle half-configured and never publishes an unsigned APK.
          missing=""
          [ -z "$RELEASE_KEYSTORE_BASE64" ] && missing="$missing RELEASE_KEYSTORE_BASE64"
          [ -z "$RELEASE_KEYSTORE_PASSWORD" ] && missing="$missing RELEASE_KEYSTORE_PASSWORD"
          [ -z "$RELEASE_KEY_ALIAS" ] && missing="$missing RELEASE_KEY_ALIAS"
          [ -z "$RELEASE_KEY_PASSWORD" ] && missing="$missing RELEASE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing signing secret(s):$missing. Add all four (RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD) so the nightly APK can be release-signed. Refusing to publish an unsigned APK."
            exit 1
          fi

      # Publish only an APK that differs from the current nightly: a push that
      # leaves the app untouched (docs, CI, tests) would otherwise replace the
      # nightly with the same app under a new version. The action rebuilds
      # HEAD as the current nightly and compares the two APKs; every step
      # below is gated on its verdict, and a failed check counts as changed.
      - name: Compare with the current nightly
        id: apk
        uses: ./.github/actions/apk-unchanged
        with:
          channel: nightly

      - name: Decode keystore
        if: steps.apk.outputs.unchanged != 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          # Write outside the checked-out tree; $RUNNER_TEMP is auto-cleaned.
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Compute version
        id: version
        if: steps.apk.outputs.unchanged != 'true'
        uses: ./.github/actions/app-version
        with:
          channel: nightly

      - name: Build the signed nightly APK
        if: steps.apk.outputs.unchanged != 'true'
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        # An APK, and only an APK: sideloading onto AI boxes / head units off
        # the GitHub release is the distribution channel, and an .aab defers
        # APK generation and signing to Google Play, so no on-device installer
        # can open one.
        run: ./gradlew assembleNightlyRelease --stacktrace

      - name: Stage the artifact with a meaningful asset name
        if: steps.apk.outputs.unchanged != 'true'
        run: |
          cp app/build/outputs/apk/nightly/release/app-nightly-release.apk "$RUNNER_TEMP/femto-car-launcher-nightly.apk"

      - name: Publish rolling nightly prerelease
        if: steps.apk.outputs.unchanged != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `gh release edit --target` cannot move an existing tag (cli/cli#8669),
          # so delete the old rolling release and tag, then recreate against the
          # exact built commit.
          #
          # Delete by RELEASE ID from the list, never by tag lookup: a release
          # whose server-side tag association is corrupted (seen 2026-07-16
          # after a GitHub incident) is invisible to `gh release delete <tag>`
          # ("release not found") yet still blocks the tag_name on create —
          # a deadlock no rerun can clear. Listing sees every release, so this
          # shape cannot wedge; an empty list (first-ever run) simply skips.
          # Remember what the outgoing nightly pointed at, for the changelog
          # below. target_commitish can be a branch name on old releases; only
          # a 40-hex value is usable as a range endpoint.
          PREVIOUS_NIGHTLY_SHA=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq '[.[] | select(.tag_name == "nightly")][0].target_commitish // empty' | grep -E '^[0-9a-f]{40}$' || true)
          echo "PREVIOUS_NIGHTLY_SHA=$PREVIOUS_NIGHTLY_SHA" >> "$GITHUB_ENV"
          gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.tag_name == "nightly") | .id' |
            while read -r release_id; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"
            done
          # Delete the tag ref explicitly (delete-by-id has no --cleanup-tag):
          # `gh release create --target` is ignored when the tag already
          # exists, so a stale ref would silently pin the new release to the
          # OLD commit. A 404 here just means no tag yet.
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" || true
          # The release notes carry the commit subjects since the previously
          # published nightly: the rolling release is the only distribution
          # channel, so its notes are the only place a reporter can see that
          # the fix for their issue has shipped. previous_sha comes from the
          # release listing above (empty on the first-ever run, where the
          # changelog degrades to just the current subject). The log follows
          # develop's own line only: a promotion sync merges main's squash
          # into develop, and listing that squash would repeat commits an
          # earlier nightly already shipped.
          {
            echo "Automated nightly build from ${GITHUB_SHA:0:7} (run #${{ github.run_number }}) on $(date -u +%Y-%m-%d)."
            echo
            echo "Changes since the previous nightly:"
            if [ -n "$PREVIOUS_NIGHTLY_SHA" ] && git cat-file -e "$PREVIOUS_NIGHTLY_SHA" 2>/dev/null; then
              git log --first-parent --no-merges --format='- %s' "$PREVIOUS_NIGHTLY_SHA..$GITHUB_SHA"
            else
              git log -1 --format='- %s' "$GITHUB_SHA"
            fi
          } > "$RUNNER_TEMP/nightly-notes.md"
          gh release create nightly \
            "$RUNNER_TEMP/femto-car-launcher-nightly.apk" \
            --target "$GITHUB_SHA" \
            --title "Nightly ${{ github.run_number }}" \
            --notes-file "$RUNNER_TEMP/nightly-notes.md" \
            --prerelease \
            --latest=false

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: validate
    # A manual run must not cut a release; re-running a failed job keeps the
    # original push event, so recovery is unaffected.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # One release at a time: the job creates a tag and a GitHub release, and a
    # second run racing it would tag the same day's counter twice.
    concurrency:
      group: stable-release
      cancel-in-progress: false
    permissions:
      # Pushing the version tag and creating the release both write contents.
      contents: write
    # This job signs stable APKs. `develop` is the default branch, and GitHub
    # Actions lets a run restore a cache written on its own branch or the
    # default branch, so a `main` run here could restore a Gradle cache that
    # `develop` code (e.g. an auto-merged dependency bump) wrote. `release`
    # runs once per push to `main` (one per promotion), so a cold Gradle
    # build is an acceptable price for keeping that cache out of the signing
    # job's reach.
    cache-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: app-version counts today's existing v* tags, and the
          # release notes below walk the log from the previous v* tag to HEAD.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          # Matches cache-mode: none, so setup-gradle never attempts a restore or save the cache service would refuse.
          cache-disabled: true

      - name: Verify signing secrets are present
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          # Fail fast (and clearly) if any signing secret is missing, so the job
          # never reaches Gradle half-configured and never publishes an unsigned APK.
          missing=""
          [ -z "$RELEASE_KEYSTORE_BASE64" ] && missing="$missing RELEASE_KEYSTORE_BASE64"
          [ -z "$RELEASE_KEYSTORE_PASSWORD" ] && missing="$missing RELEASE_KEYSTORE_PASSWORD"
          [ -z "$RELEASE_KEY_ALIAS" ] && missing="$missing RELEASE_KEY_ALIAS"
          [ -z "$RELEASE_KEY_PASSWORD" ] && missing="$missing RELEASE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing signing secret(s):$missing. Add all four (RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD) so the stable APK can be release-signed. Refusing to publish an unsigned APK."
            exit 1
          fi

      # A v* tag already on HEAD comes from an earlier run of this commit that
      # decided to publish and tagged it. That decision is not made again:
      # "Resolve the release tag" finishes the release, or refuses a second
      # one, where a skip here would strand a tag without a release.
      - name: Find a version tag already on this commit
        id: head-tag
        run: echo "tag=$(git tag --list 'v*' --points-at "$GITHUB_SHA" | head -1)" >> "$GITHUB_OUTPUT"

      # Publish only an APK that differs from the latest release, as the
      # nightly job does: an unchanged APK gets no version, no tag, and no
      # release.
      - name: Compare with the latest release
        id: apk
        if: steps.head-tag.outputs.tag == ''
        uses: ./.github/actions/apk-unchanged
        with:
          channel: stable

      - name: Decode keystore
        if: steps.apk.outputs.unchanged != 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          # Write outside the checked-out tree; $RUNNER_TEMP is auto-cleaned.
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Compute version
        id: version
        if: steps.apk.outputs.unchanged != 'true'
        uses: ./.github/actions/app-version
        with:
          channel: stable

      - name: Build the signed stable APK
        if: steps.apk.outputs.unchanged != 'true'
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        # An APK, and only an APK: sideloading onto AI boxes / head units off
        # the GitHub release is the distribution channel, and an .aab defers
        # APK generation and signing to Google Play, so no on-device installer
        # can open one.
        run: ./gradlew assembleStableRelease --stacktrace

      - name: Resolve the release tag
        id: tag
        if: steps.apk.outputs.unchanged != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          HEAD_TAG: ${{ steps.head-tag.outputs.tag }}
        run: |
          set -euo pipefail
          # Stand down if main has moved on. The concurrency group is not a
          # FIFO queue: a run reaches it only after its own `validate`, so of
          # two merges landing back to back the older one can arrive last and
          # would publish a stale commit as --latest. The newer run carries
          # both commits' changes, so nothing is lost by skipping this one.
          git fetch --quiet origin main
          tip="$(git rev-parse FETCH_HEAD)"
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::notice::main has advanced to ${tip:0:7}; that run publishes instead of this one"
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "superseded=false" >> "$GITHUB_OUTPUT"
          existing="$HEAD_TAG"
          if [ -n "$existing" ]; then
            if gh release view "$existing" >/dev/null 2>&1; then
              echo "::error::$GITHUB_SHA is already released as $existing"
              exit 1
            fi
            # A previous run tagged this commit and then failed before
            # publishing. Reuse that tag: recomputing would cut a second tag
            # for one commit and strand the first one without a release, which
            # only a hand-deleted tag could undo.
            echo "::notice::reusing $existing from a run that tagged but did not publish"
            TAG="$existing"
          else
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "::error::$TAG already exists on another commit — the day counter and the tag history disagree"
              exit 1
            fi
            # Create the ref through the API like the nightly job's tag
            # handling: `git push` would depend on the credential
            # actions/checkout persists, so a later `persist-credentials: false`
            # would break releases silently, while GH_TOKEN is what actually
            # authenticates here.
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"
          fi
          # The steps below name the asset and the release after the tag, so
          # they must see the resolved one rather than the recomputed one.
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Stage the artifact with a meaningful asset name
        if: steps.apk.outputs.unchanged != 'true' && steps.tag.outputs.superseded != 'true'
        run: |
          cp app/build/outputs/apk/stable/release/app-stable-release.apk "$RUNNER_TEMP/femto-car-launcher-$TAG.apk"

      - name: Publish the release
        if: steps.apk.outputs.unchanged != 'true' && steps.tag.outputs.superseded != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Notes span the commits since the previous v* tag; the first release
          # has none, so fall back to the whole history (|| true absorbs it).
          previous=$(git tag --list 'v*' --sort=-creatordate | grep -vxF "$TAG" | head -1 || true)
          {
            echo "Stable build from ${GITHUB_SHA:0:7} on $(date -u +%Y-%m-%d)."
            echo
            if [ -n "$previous" ]; then
              echo "Changes since $previous:"
              git log --no-merges --pretty='- %s' "$previous..$GITHUB_SHA"
            else
              echo "First stable release."
            fi
          } > "$RUNNER_TEMP/release-notes.md"
          # --latest: versionName isn't valid semver, so GitHub can't infer
          # recency from it. The install guide and the planned in-app updater
          # both read /releases/latest and need it pinned explicitly.
          gh release create "$TAG" \
            "$RUNNER_TEMP/femto-car-launcher-$TAG.apk" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --target "$GITHUB_SHA" \
            --latest
