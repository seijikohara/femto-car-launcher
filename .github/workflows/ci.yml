name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded PR runs; never cancel an in-flight main/nightly publish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      # Run the check groups as parallel jobs so wall-clock is the slowest group
      # (assemble), not their sum. The Gradle build cache (org.gradle.caching) lets
      # each job reuse the compile/dex outputs the latest main run populated, so the
      # parallel split does not triple the heavy work on warm caches. fail-fast off
      # so one failing group still reports the others.
      fail-fast: false
      matrix:
        include:
          - name: static-checks
            tasks: spotlessCheck lint
          - name: unit-tests
            # verifyRoborazziDebug runs the unit tests in screenshot-verify mode, so
            # folding it in with `test` executes testDebugUnitTest once (two separate
            # invocations ran it twice). CI-only: the Roborazzi goldens are recorded
            # on this runner OS (record-screenshots.yml), so the screenshot diff runs
            # here, not in the local verify-android-build skill — a developer's render
            # would mismatch the Linux-recorded goldens on font antialiasing.
            tasks: test verifyRoborazziDebug
          - name: assemble
            tasks: assembleDebug
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up JDK 21
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          # setup-gradle writes the cache only on the default branch; make the
          # read-only fallback explicit so feature branches never pollute it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The three groups together mirror the local verify-android-build skill
      # (spotlessCheck + test + lint + assembleDebug); change both together.
      - name: Run ${{ matrix.name }}
        env:
          GRADLE_TASKS: ${{ matrix.tasks }}
        run: ./gradlew $GRADLE_TASKS --stacktrace

  # Single status check the branch ruleset requires by the name "Validate". It
  # stays stable regardless of how the matrix legs above are split or renamed, and
  # fails if any leg failed (needs.checks.result is success only when all legs pass).
  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs: checks
    if: always()
    steps:
      - name: Confirm all check groups passed
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          if [ "$CHECKS_RESULT" != "success" ]; then
            echo "::error::A Validate check group failed (result: $CHECKS_RESULT)."
            exit 1
          fi

  nightly:
    name: Publish nightly
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name != 'pull_request'
    # Serialize publishes so two concurrent main pushes never race on the rolling
    # "nightly" tag (delete-then-create); queue them rather than cancel an
    # in-flight publish midway.
    concurrency:
      group: nightly-release
      cancel-in-progress: false
    permissions:
      # gh release create/delete + tag manipulation require write access to repo
      # contents. The default GITHUB_TOKEN satisfies this for the same repo.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Full history so the rolling "nightly" tag can be deleted and re-pointed.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Verify signing secrets are present
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          # Fail fast (and clearly) if any signing secret is missing, so the job
          # never reaches Gradle half-configured and never publishes an unsigned APK.
          missing=""
          [ -z "$RELEASE_KEYSTORE_BASE64" ] && missing="$missing RELEASE_KEYSTORE_BASE64"
          [ -z "$RELEASE_KEYSTORE_PASSWORD" ] && missing="$missing RELEASE_KEYSTORE_PASSWORD"
          [ -z "$RELEASE_KEY_ALIAS" ] && missing="$missing RELEASE_KEY_ALIAS"
          [ -z "$RELEASE_KEY_PASSWORD" ] && missing="$missing RELEASE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing signing secret(s):$missing. Add all four (RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD) so the nightly APK can be release-signed. Refusing to publish an unsigned APK."
            exit 1
          fi

      - name: Decode keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          # Write outside the checked-out tree; $RUNNER_TEMP is auto-cleaned.
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK and AAB
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: nightly-${{ github.run_number }}-${{ github.sha }}
        # AAB is the Play upload format (required for new apps); APK stays for
        # direct sideload onto AI boxes / head units off the GitHub release.
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Stage artifacts with meaningful asset names
        run: |
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/femto-car-launcher-nightly.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/femto-car-launcher-nightly.aab"

      - name: Publish rolling nightly prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `gh release edit --target` cannot move an existing tag (cli/cli#8669),
          # so delete the old rolling release and tag, then recreate against the
          # exact built commit. `|| true` keeps the first-ever run idempotent.
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly \
            "$RUNNER_TEMP/femto-car-launcher-nightly.apk" \
            "$RUNNER_TEMP/femto-car-launcher-nightly.aab" \
            --target "$GITHUB_SHA" \
            --title "Nightly ${{ github.run_number }}" \
            --notes "Automated nightly build from ${GITHUB_SHA:0:7} (run #${{ github.run_number }}) on $(date -u +%Y-%m-%d)." \
            --prerelease \
            --latest=false
