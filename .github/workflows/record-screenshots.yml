name: Record screenshots

# Record the Roborazzi golden images on the CI runner — the SAME OS / JDK that
# verifyRoborazziDebug compares against in ci.yml — and upload them as an artifact
# to commit into the repo. Font antialiasing differs across OSes, so goldens cannot
# be recorded reliably on a developer's machine. Run this whenever the dashboard's
# intended appearance changes, then download the artifact and commit the PNGs.
on:
  workflow_dispatch:

jobs:
  record:
    name: Record goldens
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Record goldens
        run: ./gradlew recordRoborazziDebug --stacktrace

      - name: Upload goldens
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: roborazzi-goldens
          path: app/src/test/screenshots/
          if-no-files-found: error
