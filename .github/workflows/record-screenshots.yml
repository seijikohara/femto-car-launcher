name: Record screenshots

# Record the Roborazzi golden images on the CI runner — the SAME OS / JDK that
# verifyRoborazziStableDebug compares against in ci.yml — and upload them as an
# artifact to commit into the repo. Font antialiasing differs across OSes, so goldens
# cannot be recorded reliably on a developer's machine. Run this whenever the
# dashboard's intended appearance changes, then download the artifact and commit the
# PNGs.
on:
  workflow_dispatch:

jobs:
  record:
    name: Record goldens
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      - name: Record goldens
        run: ./gradlew recordRoborazziStableDebug --stacktrace

      - name: Upload goldens
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roborazzi-goldens
          path: app/src/test/screenshots/
          if-no-files-found: error
