name: Record screenshots

# Record the Roborazzi golden images on the CI runner — the SAME OS / JDK that
# verifyRoborazziDebug compares against in `ci.yml`, so the goldens match (font
# antialiasing differs across OSes, which is why they cannot be recorded on a
# developer's machine). Run this manually whenever the dashboard's intended
# appearance changes; it records and commits the refreshed PNGs back to the branch.
on:
  workflow_dispatch:

jobs:
  record:
    name: Record goldens
    runs-on: ubuntu-latest
    permissions:
      # Push the recorded goldens back to the branch.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up JDK 21
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Record goldens
        run: ./gradlew recordRoborazziDebug --stacktrace

      - name: Commit refreshed goldens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/test/screenshots
          if git diff --staged --quiet; then
            echo "Goldens unchanged."
          else
            git commit -m "chore(screenshots): record dashboard goldens on CI"
            git push
          fi
