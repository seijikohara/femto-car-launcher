name: Docs site

# Build the project website under docs/ and publish it to GitHub Pages on
# every push to main. ci.yml's docs-site job only proves the site builds (on
# pull requests and on main pushes); this workflow is the one that deploys.
# Pages keeps the previous deployment when a run fails, so a red build never
# takes the site down.
#
# Every deploy carries two screenshot catalogs, built across three jobs:
# - nightly-catalog renders the nightly catalog from develop. develop carries
#   code main has not taken yet (Renovate automerges dependency updates into
#   it), and its Gradle build executes that code, so the render runs in a job
#   of its own, on a fresh runner. Enforced there: a contents: read token that
#   checkout does not leave behind, and cache-mode: read, so the job may
#   restore caches but can never save one. Not prevented: code in the job can
#   still upload artifacts to this run. build therefore validates the catalog
#   it downloads as untrusted input, and the worst an extra artifact can do is
#   take the Pages artifact's name, so the Pages upload fails and the previous
#   deployment stays up.
# - build renders the stable catalog from main, imports the validated nightly
#   catalog, builds the site and uploads the Pages artifact, with
#   cache-mode: none: develop is the default branch, so a main run restores
#   the caches develop runs write, and the job that produces the public site
#   must not consume any of them.
# - deploy publishes that artifact. It is the only job granted pages: write
#   and id-token: write, so develop's code never runs beside the deployment
#   credentials.
# The nightly half is best-effort at every stage (render, download,
# validation, import): a broken develop never blocks the stable site, a deploy
# can ship with only the stable catalog, and the viewer (docs/src/catalog/)
# hides the nightly switch whenever that happens.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only for every job; deploy alone widens its own grant.
permissions:
  contents: read

# No job touches the Actions cache unless it opts in below.
cache-mode: none

# One deployment at a time; queue rather than cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  nightly-catalog:
    name: Render the nightly catalog
    runs-on: ubuntu-latest
    # A red develop must not turn main's docs run red; build carries on
    # without the nightly catalog anyway. This also makes
    # needs.nightly-catalog.result report success even when the job failed,
    # so build gates its download on the upload's artifact-id output instead.
    continue-on-error: true
    # One ~10–20 min catalog render plus a cold Gradle compile.
    timeout-minutes: 60
    # Explicit, so a later workflow-level grant never reaches develop's code.
    permissions:
      contents: read
    # Restore only. This run is triggered from main, so a save would put
    # develop's entries in main's cache scope, which main's own builds (the
    # stable release included) restore. The job's scoped cache token enforces
    # this whatever the code in the job does.
    cache-mode: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      # Empty unless the upload below succeeded.
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: develop
          # Nothing here pushes, so the token need not stay on the runner
          # for develop's build to find.
          persist-credentials: false

      - name: Resolve the rendered commit SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          # cache-mode: read (above) is what forbids the save; this only stops
          # setup-gradle from packing Gradle User Home for a save the job's
          # token would refuse.
          cache-read-only: true

      # The same full render as the stable one in build. The generator takes
      # its gitSha from $GITHUB_SHA before falling back to `git rev-parse
      # HEAD` (app/build.gradle.kts, femto.catalog.gitSha), and GITHUB_SHA is
      # main's commit for the whole run. The override has to happen in the
      # shell: the runner re-exports GITHUB_* after applying a step's env:
      # block, so an env: override is silently ignored and the manifest would
      # claim main's commit instead of the tree it was rendered from.
      - name: Render the screenshot catalog
        env:
          RENDERED_SHA: ${{ steps.sha.outputs.sha }}
        run: GITHUB_SHA="$RENDERED_SHA" ./gradlew :app:generateCatalog --stacktrace

      # A partial render must not become an artifact at all.
      - name: Check the catalog render
        env:
          RENDERED_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          manifest=app/build/outputs/catalog/manifest.json
          jq -e --arg sha "$RENDERED_SHA" \
            '.schemaVersion == 1 and .gitSha == $sha and (.entries | length) > 0' "$manifest"
          test "$(ls app/build/outputs/catalog/img | wc -l)" -eq "$(jq '.entries | length' "$manifest")"

      # The upload carries the catalog and nothing else. The PNGs are already
      # deflated, so compression level 0 skips a second pass over ~1 GB for
      # nothing.
      - name: Upload the catalog
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-catalog
          path: |
            app/build/outputs/catalog/manifest.json
            app/build/outputs/catalog/img/*.png
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  build:
    name: Build site
    # needs only orders the jobs, so the nightly artifact exists before the
    # download below; !cancelled() runs this job whatever the nightly render's
    # result, so a red develop never holds back the stable site.
    needs: nightly-catalog
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # One ~10–20 min catalog render plus a cold Gradle compile on a 4-vCPU
    # runner (no cache at all, see cache-mode) before the pnpm steps even
    # start; the nightly steps below are capped at 12 min between them.
    timeout-minutes: 60
    # Explicit rather than inherited: this job produces the public site, so
    # it must never restore a cache that develop's code could have written,
    # even if the workflow-level default changes. Every deploy pays for a
    # cold Gradle, which is fine at one deploy per main push.
    cache-mode: none
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          # cache-mode: none already denies every restore and save; this keeps
          # setup-gradle from packing Gradle User Home for a save that would
          # only be refused.
          cache-disabled: true

      # 960 dashboard renders (12 geometries × 5 sizes × 2 themes × 2 driver
      # sides × 4 dock positions) via Roborazzi; category-gated, so this
      # workflow is the only place the full set is ever rendered.
      - name: Render the screenshot catalog (stable)
        working-directory: .
        run: ./gradlew :app:generateCatalog --stacktrace

      # The importer skips silently when no manifest exists (that is the PR-build
      # path); the deploy must never publish an empty or partial catalog.
      - name: Check the stable catalog render
        working-directory: .
        run: |
          manifest=app/build/outputs/catalog/manifest.json
          jq -e --arg sha "$GITHUB_SHA" \
            '.schemaVersion == 1 and .gitSha == $sha and (.entries | length) > 0' "$manifest"
          test "$(ls app/build/outputs/catalog/img | wc -l)" -eq "$(jq '.entries | length' "$manifest")"

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: docs/package.json

      # No `cache: pnpm`: the job runs with cache-mode: none, so the store is
      # fetched from the registry against the frozen lockfile instead.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: docs/.node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Order matters: import-catalog rmSyncs its output directory first, and
      # public/catalog is the nightly import's PARENT directory below — importing
      # stable second would wipe public/catalog/nightly right back out.
      - name: Import the stable catalog into the site
        run: pnpm run import-catalog -- ../app/build/outputs/catalog

      # The three nightly steps below carry their own timeouts, so a hostile,
      # oversized artifact cannot run this job into its own timeout and take
      # the stable deploy down with it. Sized from the last deploy: at the
      # ~30 MB/s its Pages upload reached, the ~1 GB catalog downloads in under
      # a minute; validation takes under 10 s for 960 entries; the stable
      # import took 54 s.
      #
      # By ID, not by name: the ID is the one nightly-catalog's upload step
      # reported, and it is empty whenever that upload did not happen.
      - name: Download the nightly catalog
        id: nightly-download
        if: needs.nightly-catalog.outputs.artifact-id != ''
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.nightly-catalog.outputs.artifact-id }}
          path: ${{ runner.temp }}/nightly-catalog

      # Untrusted input: the artifact comes out of a job that ran develop's
      # code, and this job goes on to build the Pages artifact. The render
      # checks are repeated here (the nightly job's own pass proves nothing),
      # and the directory must hold exactly manifest.json plus one
      # img/<id>.png per entry before the importer reads anything from it.
      - name: Validate the nightly catalog
        id: nightly-validate
        if: steps.nightly-download.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        env:
          NIGHTLY_SHA: ${{ needs.nightly-catalog.outputs.sha }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/nightly-catalog"
          manifest="$dir/manifest.json"
          reject() {
            echo "::warning::Skipping the nightly catalog: $1"
            exit 1
          }
          [[ "$NIGHTLY_SHA" =~ ^[0-9a-f]{40}$ ]] || reject "nightly-catalog reported no commit SHA"
          # The stable render's checks: schema version, rendered commit, image
          # count; entries must also be an array, since length and .[] accept
          # an object too and the importer only handles an array.
          jq -e --arg sha "$NIGHTLY_SHA" \
            '.schemaVersion == 1 and .gitSha == $sha and (.entries | type == "array") and (.entries | length) > 0' "$manifest" ||
            reject "manifest.json is not a schema-1 manifest of $NIGHTLY_SHA"
          test "$(ls "$dir/img" | wc -l)" -eq "$(jq '.entries | length' "$manifest")" ||
            reject "the image count does not match the manifest"
          # import-catalog reads entry.file and names its output after entry.id,
          # so each entry must point at its own image under a plain file-name id.
          # \A and \z, not ^ and $: jq's $ also matches before a trailing newline.
          jq -e 'all(.entries[]; (.id | type == "string" and test("\\A[A-Za-z0-9][A-Za-z0-9._-]*\\z")) and .file == "img/\(.id).png")' "$manifest" ||
            reject "an entry id or image path is malformed"
          # On disk: regular files under plain names, no directory but img/, and
          # exactly manifest.json plus the images the manifest lists.
          test -z "$(find "$dir" -mindepth 1 \( ! -type f ! -type d -o -name '*[!A-Za-z0-9._-]*' \) -print -quit)" ||
            reject "the artifact holds a link, a special file or an unexpected name"
          test "$(find "$dir" -mindepth 1 -type d)" = "$dir/img" ||
            reject "the artifact holds a directory other than img/"
          diff <(cd "$dir" && find . -type f | sort) \
            <({ echo ./manifest.json; jq -r '.entries[] | "./" + .file' "$manifest"; } | sort) ||
            reject "the files on disk do not match the manifest"
          # sharp picks its decoder from the bytes, not the file name, so every
          # image must open with the PNG signature to stay on the PNG decoder.
          find "$dir/img" -type f -exec sh -c '
            for png; do
              [ "$(head -c 8 "$png" | od -An -tx1 | tr -d " \n")" = 89504e470d0a1a0a ] || exit 1
            done' sh {} + ||
            reject "an image is not a PNG"

      # Best-effort as well: an image can pass the checks above and still fail
      # to convert, and that must not block the stable deploy.
      - name: Import the nightly catalog into the site
        id: nightly-import
        if: steps.nightly-validate.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        run: pnpm run import-catalog -- "$RUNNER_TEMP/nightly-catalog" public/catalog/nightly

      # The importer clears its output first and writes manifest.json last, so
      # the viewer already hides the switch after a failed import; this only
      # keeps the half-converted images out of the deploy.
      - name: Drop a failed nightly import
        if: steps.nightly-import.outcome == 'failure'
        run: rm -rf public/catalog/nightly

      # The download is no longer needed either way, and an oversized one that
      # filled the disk would otherwise break the site build below.
      - name: Discard the nightly download
        if: steps.nightly-download.outcome != 'skipped'
        continue-on-error: true
        run: rm -rf "$RUNNER_TEMP/nightly-catalog"

      - name: Build
        run: pnpm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # The explicit result check replaces the implicit success(), which counts
    # every ancestor job: a nightly-catalog that did not succeed (one that hit
    # its timeout is recorded as cancelled, continue-on-error or not) would
    # otherwise skip the stable deploy even after build succeeded.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write # create the Pages deployment
      id-token: write # mint the OIDC token Pages verifies the deploying ref with
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
