name: Docs site

# Build the project website under docs/ and publish it to GitHub Pages on
# every push to main. ci.yml's docs-site job only proves the site builds (on
# pull requests and on main pushes); this workflow is the one that deploys.
# Pages keeps the previous deployment when a run fails, so a red build never
# takes the site down. The screenshot-catalog step (generateCatalog +
# import-catalog) renders and imports the full matrix before every deploy,
# adding roughly 10–20 minutes.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; queue rather than cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          # setup-gradle writes the cache only on the default branch; make the
          # read-only fallback explicit so feature branches never pollute it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # 960 dashboard renders (12 geometries × 5 sizes × 2 themes × 2 driver
      # sides × 4 dock positions) via Roborazzi; category-gated, so this is the
      # only place the full set is ever rendered.
      - name: Render the screenshot catalog
        working-directory: .
        run: ./gradlew :app:generateCatalog --stacktrace

      # The importer skips silently when no manifest exists (that is the PR-build
      # path); the deploy must never publish an empty or partial catalog.
      - name: Check the catalog render
        working-directory: .
        run: |
          manifest=app/build/outputs/catalog/manifest.json
          jq -e --arg sha "$GITHUB_SHA" \
            '.schemaVersion == 1 and .gitSha == $sha and (.entries | length) > 0' "$manifest"
          test "$(ls app/build/outputs/catalog/img | wc -l)" -eq "$(jq '.entries | length' "$manifest")"

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: docs/package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: docs/.node-version
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Import the catalog into the site
        run: pnpm run import-catalog -- ../app/build/outputs/catalog

      - name: Build
        run: pnpm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
