# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# JVM arguments for the daemon process. MaxMetaspaceSize bounds the long-lived
# daemon's native memory so it does not grow unbounded across incremental builds;
# HeapDumpOnOutOfMemoryError writes a dump for diagnosis if the heap is exhausted.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# Run independent tasks concurrently (the :app module and the webmap node build).
org.gradle.parallel=true
# Reuse task outputs across builds. The CI runner persists the local build cache
# (~/.gradle/caches/build-cache-1, written on main, read on PRs via setup-gradle),
# so the heavy dex/compile tasks come FROM-CACHE on incremental and cross-job runs.
org.gradle.caching=true
# Cache the configuration phase (task graph) and reuse it when build inputs are
# unchanged, skipping project configuration on incremental and IDE-sync runs.
# Stable since Gradle 9; the largest build-performance lever after the build cache.
org.gradle.configuration-cache=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
